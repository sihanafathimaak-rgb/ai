<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="InterviewMate AI - your personal interview teacher and speaking coach.">
	<title>InterviewMate AI | Interview coach</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="code.css">
</head>
<body>
	<div class="app-shell">
		<header class="topbar">
			<a class="brand" href="#home" data-view="home" aria-label="InterviewMate AI home">
				<span class="brand-mark"><span></span><span></span><span></span></span>
				<span>InterviewMate <b>AI</b></span>
			</a>
			<nav class="main-nav" aria-label="Main navigation">
				<button class="nav-link active" data-view="home">Home</button>
				<button class="nav-link" data-view="prepare">Prepare</button>
				<button class="nav-link" data-view="aptitude">Aptitude</button>
				<button class="nav-link" data-view="progress">My progress</button>
			</nav>
			<div class="header-actions">
				<label class="language-select" aria-label="Choose language">
					<span class="language-dot"></span>
					<select id="globalLanguage">
						<option value="tanglish">Tanglish</option>
						<option value="english">English</option>
						<option value="tamil">தமிழ்</option>
					</select>
				</label>
				<button class="icon-button" id="settingsButton" aria-label="Open settings" title="Settings">⚙</button>
			</div>
		</header>

		<main id="app" tabindex="-1"></main>

		<footer class="footer"><span>INTERVIEWMATE AI</span><span>Your next confident answer starts here.</span><span id="footerYear"></span></footer>
	</div>
	<div id="toast" class="toast" role="status" aria-live="polite"></div>
	<dialog id="settingsDialog" class="settings-dialog">
		<div class="dialog-heading"><div><span class="eyebrow">PREFERENCES</span><h2>Make practice feel like yours.</h2></div><button class="close-button" id="closeSettings" aria-label="Close settings">×</button></div>
		<div class="settings-grid">
			<label>Voice<select id="voiceSelect"><option value="auto">Auto-select best voice</option></select></label>
			<label>Speech speed<select id="speedSelect"><option value="0.85">Slow</option><option value="1" selected>Normal</option><option value="1.15">Fast</option></select></label>
			<label class="switch-row">Auto-speak <input id="autoSpeak" type="checkbox" checked><span class="switch"></span></label>
			<label class="switch-row">Auto-listening <input id="autoListen" type="checkbox"><span class="switch"></span></label>
		</div>
		<button class="button button-primary" id="saveSettings">Save preferences</button>
	</dialog>
	<script src="code.js"></script>
</body>
</html>
